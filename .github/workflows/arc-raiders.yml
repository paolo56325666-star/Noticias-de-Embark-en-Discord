name: ARC Raiders News → Discord

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
      timezone: "America/Montevideo"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  check-news:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consultar noticias
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |
          python arc_raiders_news.py

      - name: Guardar estado
        run: |

          git config user.name "ARC Raiders News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Actualizar estado de ARC Raiders News"

          git push
