name: ARC Raiders News → Discord

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
      timezone: "America/Montevideo"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  check-news:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Consultar noticias
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |
          python arc_raiders_news.py

      - name: Guardar estado
        run: |

          git config user.name "ARC Raiders News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Actualizar estado de ARC Raiders News"

          git push

      - name: Guardar página de depuración
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: debug-arc-raiders

          path: debug_page.html

          if-no-files-found: ignore
